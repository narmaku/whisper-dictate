[project]
name = "whisper-dictate"
version = "0.1.0"
description = "Minimal voice-to-text for Linux using local Whisper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "PySide6-Essentials",
]

[project.scripts]
whisper-dictate = "dictate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
